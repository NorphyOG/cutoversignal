name: Package tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run package self-tests
        run: npm test
      - name: Smoke-test the local action without publishing report evidence
        uses: ./
        with:
          path: test
          output: action-smoke-report.json
          format: json
          fail-on-findings: "false"
          upload-report: "false"
